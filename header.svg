<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090e1a"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  <path id="searchPath" d="M690 238 L750 170 L805 205 L865 110 L930 150 L990 85 L1060 130 L1125 68"/>
</defs>

<rect width="1200" height="320" rx="24" fill="url(#bg)"/>

<!-- subtle algorithm/grid background -->
<g opacity=".14" stroke="#94a3b8" stroke-width="1">
  <path d="M0 48H1200M0 96H1200M0 144H1200M0 192H1200M0 240H1200M0 288H1200"/>
  <path d="M54 0V320M108 0V320M162 0V320M216 0V320M270 0V320M324 0V320M378 0V320M432 0V320M486 0V320M540 0V320M594 0V320M648 0V320M702 0V320M756 0V320M810 0V320M864 0V320M918 0V320M972 0V320M1026 0V320M1080 0V320M1134 0V320"/>
</g>

<!-- LEFT: profile -->
<text x="70" y="105" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">ANUJA KUMARI</text>
<text x="72" y="150" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">AI/ML • Software Engineering • NLP • Intelligent Systems</text>
<text x="72" y="194" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="17">Building practical systems with algorithms, machine learning and code.</text>

<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">
  <rect x="72" y="225" width="82" height="32" rx="16" fill="#1e293b"/><text x="93" y="246">Python</text>
  <rect x="164" y="225" width="65" height="32" rx="16" fill="#1e293b"/><text x="185" y="246">C++</text>
  <rect x="239" y="225" width="80" height="32" rx="16" fill="#1e293b"/><text x="259" y="246">PyTorch</text>
  <rect x="329" y="225" width="112" height="32" rx="16" fill="#1e293b"/><text x="349" y="246">TypeScript</text>
  <rect x="451" y="225" width="78" height="32" rx="16" fill="#1e293b"/><text x="470" y="246">Next.js</text>
</g>
<text x="72" y="292" fill="#64748b" font-family="monospace" font-size="13">DATA → MODEL → ALGORITHM → SYSTEM</text>

<!-- RIGHT: graph / Best-First Search visualization -->
<text x="680" y="42" fill="#67e8f9" font-family="monospace" font-size="13" letter-spacing="2">BEST-FIRST SEARCH</text>
<text x="680" y="61" fill="#64748b" font-family="monospace" font-size="10">OPEN → EXPAND → EVALUATE → PATH</text>

<!-- graph edges -->
<g fill="none" stroke="#334155" stroke-width="2">
  <path d="M690 238 L750 170 L805 205 L865 110 L930 150 L990 85 L1060 130 L1125 68"/>
  <path d="M750 170 L805 105 L865 110"/>
  <path d="M805 205 L865 250 L930 150"/>
  <path d="M930 150 L990 210 L1060 130"/>
  <path d="M990 85 L1060 130 L1125 68"/>
</g>

<!-- explored route -->
<path d="M690 238 L750 170 L805 205 L865 110 L930 150 L990 85 L1060 130 L1125 68"
      fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="9 9" opacity=".9">
  <animate attributeName="stroke-dashoffset" from="72" to="0" dur="2.4s" repeatCount="indefinite"/>
</path>

<!-- soft route glow -->
<path d="M690 238 L750 170 L805 205 L865 110 L930 150 L990 85 L1060 130 L1125 68"
      fill="none" stroke="#67e8f9" stroke-width="9" opacity=".08" filter="url(#soft)"/>

<!-- nodes -->
<g fill="#0f172a" stroke="#67e8f9" stroke-width="2">
  <circle cx="690" cy="238" r="7"/><circle cx="750" cy="170" r="7"/>
  <circle cx="805" cy="205" r="7"/><circle cx="805" cy="105" r="6"/>
  <circle cx="865" cy="110" r="8"/><circle cx="865" cy="250" r="6"/>
  <circle cx="930" cy="150" r="8"/><circle cx="990" cy="85" r="8"/>
  <circle cx="990" cy="210" r="6"/><circle cx="1060" cy="130" r="8"/>
  <circle cx="1125" cy="68" r="9"/>
</g>

<!-- start / goal -->
<text x="675" y="265" fill="#94a3b8" font-family="monospace" font-size="10">START</text>
<text x="1090" y="50" fill="#a78bfa" font-family="monospace" font-size="10">GOAL</text>

<!-- moving search agent -->
<circle r="6" fill="#ffffff" stroke="#67e8f9" stroke-width="3" filter="url(#glow)">
  <animateMotion dur="3.8s" repeatCount="indefinite" rotate="auto">
    <mpath href="#searchPath"/>
  </animateMotion>
</circle>

<!-- expanding/search pulse -->
<circle cx="805" cy="205" r="9" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0">
  <animate attributeName="r" values="8;25;8" dur="2.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".8;0;.8" dur="2.2s" repeatCount="indefinite"/>
</circle>

<!-- tiny live status -->
<g font-family="monospace" font-size="10">
  <text x="680" y="292" fill="#64748b">heuristic: h(n)</text>
  <text x="790" y="292" fill="#64748b">priority queue</text>
  <text x="925" y="292" fill="#67e8f9">● searching...</text>
</g>
</svg>