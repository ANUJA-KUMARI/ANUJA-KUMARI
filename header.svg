<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090e1a"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="ghostGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e0fbff"/><stop offset="1" stop-color="#8be9ff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  <path id="ghostRoute" d="M720 220 C770 120 835 105 900 165 S1015 245 1085 130 S1120 100 1135 85"/>
  <g id="goldBug">
    <ellipse cx="0" cy="0" rx="6" ry="5" fill="#ffd166" filter="url(#glow)"/>
    <ellipse cx="-8" cy="-5" rx="6" ry="3" fill="#ffe7a3" opacity=".8"><animate attributeName="ry" values="2;5;2" dur=".28s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="8" cy="-5" rx="6" ry="3" fill="#ffe7a3" opacity=".8"><animate attributeName="ry" values="5;2;5" dur=".28s" repeatCount="indefinite"/></ellipse>
    <path d="M0 4V11" stroke="#ffd166" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="redBug">
    <ellipse cx="0" cy="0" rx="6" ry="5" fill="#ff667a" filter="url(#glow)"/>
    <ellipse cx="-8" cy="-5" rx="6" ry="3" fill="#ffb0ba" opacity=".8"><animate attributeName="ry" values="2;5;2" dur=".24s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="8" cy="-5" rx="6" ry="3" fill="#ffb0ba" opacity=".8"><animate attributeName="ry" values="5;2;5" dur=".24s" repeatCount="indefinite"/></ellipse>
    <path d="M0 4V11" stroke="#ff667a" stroke-width="2" stroke-linecap="round"/>
  </g>
</defs>

<rect width="1200" height="320" rx="24" fill="url(#bg)"/>
<g opacity=".14" stroke="#94a3b8" stroke-width="1">
  <path d="M0 48H1200M0 96H1200M0 144H1200M0 192H1200M0 240H1200M0 288H1200"/>
  <path d="M54 0V320M108 0V320M162 0V320M216 0V320M270 0V320M324 0V320M378 0V320M432 0V320M486 0V320M540 0V320M594 0V320M648 0V320M702 0V320M756 0V320M810 0V320M864 0V320M918 0V320M972 0V320M1026 0V320M1080 0V320M1134 0V320"/>
</g>

<!-- Profile identity -->
<text x="70" y="105" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">ANUJA KUMARI</text>
<text x="72" y="150" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">AI/ML • Software Engineering • NLP • Intelligent Systems</text>
<text x="72" y="194" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="17">Building practical systems with algorithms, machine learning and code.</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">
  <rect x="72" y="225" width="82" height="32" rx="16" fill="#1e293b"/><text x="93" y="246">Python</text>
  <rect x="164" y="225" width="65" height="32" rx="16" fill="#1e293b"/><text x="185" y="246">C++</text>
  <rect x="239" y="225" width="80" height="32" rx="16" fill="#1e293b"/><text x="259" y="246">PyTorch</text>
  <rect x="329" y="225" width="112" height="32" rx="16" fill="#1e293b"/><text x="349" y="246">TypeScript</text>
  <rect x="451" y="225" width="78" height="32" rx="16" fill="#1e293b"/><text x="470" y="246">Next.js</text>
</g>
<text x="72" y="292" fill="#64748b" font-family="monospace" font-size="13">DATA → MODEL → ALGORITHM → SYSTEM</text>

<!-- Ghost bug-hunting scene -->
<text x="680" y="42" fill="#67e8f9" font-family="monospace" font-size="13" letter-spacing="2">GHOST BUG HUNTER</text>
<text x="680" y="61" fill="#64748b" font-family="monospace" font-size="10">SCAN → CHASE → DEBUG → REPEAT</text>
<path d="M680 160 C770 70 820 280 910 170 S1050 70 1160 190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 8" opacity=".8"/>
<path d="M720 220 C770 120 835 105 900 165 S1015 245 1085 130 S1120 100 1135 85" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="5 10" opacity=".35">
  <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="2s" repeatCount="indefinite"/>
</path>

<!-- Floating bug fireflies -->
<g>
  <use href="#goldBug" x="0" y="0">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M1040 95 C1100 60 1145 110 1085 145 S1010 115 1040 95"/>
  </use>
  <use href="#redBug">
    <animateMotion dur="4.4s" repeatCount="indefinite" path="M1100 245 C1150 210 1140 165 1080 185 S1050 250 1100 245"/>
  </use>
  <use href="#goldBug">
    <animateMotion dur="6s" repeatCount="indefinite" path="M760 120 C800 85 845 125 820 165 S760 170 760 120"/>
  </use>
</g>

<!-- Flying robot ghost -->
<g>
  <animateMotion dur="5.2s" repeatCount="indefinite" rotate="auto">
    <mpath href="#ghostRoute"/>
  </animateMotion>
  <ellipse cx="0" cy="15" rx="49" ry="58" fill="#45dfff" opacity=".13" filter="url(#soft)"/>
  <path d="M-37 26 C-48 3 -43 -29 -22 -43 C-7 -54 15 -53 30 -38 C48 -19 47 10 38 27 L25 19 L10 33 L-4 20 L-20 34 L-31 20 Z"
        fill="url(#ghostGlow)" stroke="#67e8f9" stroke-width="3"/>
  <path d="M-18 -42V-54 M-18 -54 Q0 -68 18 -54" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <path d="M-48 -8 L-59 2 L-48 12 M48 -8 L59 2 L48 12" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <rect x="-29" y="-23" width="58" height="38" rx="15" fill="#0b1930" stroke="#48dfff" stroke-width="2"/>
  <ellipse cx="-13" cy="-5" rx="6" ry="9" fill="#42e7ff" filter="url(#glow)"/>
  <ellipse cx="13" cy="-5" rx="6" ry="9" fill="#42e7ff" filter="url(#glow)"/>
  <circle cx="-15" cy="-8" r="2" fill="#fff"/>
  <circle cx="11" cy="-8" r="2" fill="#fff"/>
  <path d="M-7 8 Q0 14 7 8" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
  <path d="M-29 38 Q-19 50 -8 38 M8 38 Q20 50 30 37" fill="none" stroke="#8be9ff" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Capture sparks -->
<g fill="#67e8f9" filter="url(#glow)">
  <circle cx="0" cy="0" r="3"><animateMotion dur="1.6s" repeatCount="indefinite" path="M1000 160 Q1030 120 1060 145"/></circle>
  <circle cx="0" cy="0" r="2"><animateMotion dur="1.9s" repeatCount="indefinite" path="M990 190 Q1020 220 1050 200"/></circle>
</g>
<text x="1000" y="82" fill="#ffd166" font-family="monospace" font-size="10">BUG FIREFLY</text>
<text x="1080" y="270" fill="#ff8292" font-family="monospace" font-size="10">ERROR</text>
<text x="680" y="292" fill="#64748b" font-family="monospace" font-size="10">AUTONOMOUS DEBUGGING UNIT</text>
<circle cx="1014" cy="291" r="3" fill="#67e8f9" filter="url(#glow)"/>
<text x="1026" y="295" fill="#67e8f9" font-family="monospace" font-size="10">HUNTING ACTIVE</text>
</svg>